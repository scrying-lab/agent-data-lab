# Overlay for the official workshop distribution (Docker Compose >= 2.24.4).
services:
  gateway-controller:
    ports: !override
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9094:9092"
  gateway-runtime:
    ports: !override
      - "127.0.0.1:8443:8443"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
